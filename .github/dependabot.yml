version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    assignees:
      - "BoBoBaSs84"
    groups:
      # @vitest/coverage-v8 peer-depends on an exact vitest version,
      # so bumping either one alone breaks `npm ci` with ERESOLVE.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    assignees:
      - "BoBoBaSs84"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    assignees:
      - "BoBoBaSs84"
