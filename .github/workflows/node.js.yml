# Lint + unit tests on every push/PR, plus a Testcontainers-driven e2e matrix
# across the supported SQL Server versions.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint-unit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # SQL Server 2025 image may still be preview-only; don't fail the build on it.
    continue-on-error: ${{ contains(matrix.mssql-image, ':2025') }}
    strategy:
      fail-fast: false
      matrix:
        mssql-image:
          - mcr.microsoft.com/mssql/server:2019-latest
          - mcr.microsoft.com/mssql/server:2022-latest
          - mcr.microsoft.com/mssql/server:2025-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - name: Run e2e tests
        env:
          MSSQL_IMAGE: ${{ matrix.mssql-image }}
        run: npm run test:e2e
