name: Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: MssqlExporter.slnx
  CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build --report-trx --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results/*.trx

  e2e:
    runs-on: ubuntu-latest
    # SQL Server 2025 image may still be preview-only; don't fail the build on it.
    continue-on-error: ${{ contains(matrix.mssql-image, ':2025') }}
    strategy:
      fail-fast: false
      matrix:
        mssql-image:
          - mcr.microsoft.com/mssql/server:2019-latest
          - mcr.microsoft.com/mssql/server:2022-latest
          - mcr.microsoft.com/mssql/server:2025-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run e2e tests
        env:
          MSSQL_IMAGE: ${{ matrix.mssql-image }}
        run: dotnet test tests/MssqlExporter.E2E.Tests -c Release

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build image
        run: docker build -t prometheus-mssql-exporter:ci .
